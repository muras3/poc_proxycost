name: ci

# **pull_request だけで焚く。** push でも焚くと、PR にプッシュするたび
# 同じコミットを2回検証することになる。concurrency group を分けても
# event が違えば別 group になるので効かない。
# main への push は deploy.yml が受け持つ。
on:
  pull_request:

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# 速さのために安定性を売らない。
#   - retries は 0 のまま（playwright.config.ts）。**再試行で不安定さを隠さない**
#   - テストは1件も削らない。分けて同時に走らせるだけ
#   - 落ちたらトレースとスクリーンショットを残す。ログを追わせない
#
# 分け方は実測で決めた（2026-09-07、4コアの機械、212件）:
#   workers=1 → 4.9分 / workers=2 → 3.6分 / workers=4 → 3.0分（いずれも201件緑）
# **並列にして落ちるテストは1件も無かった**ので、隠れた状態依存は無い。
# ただし workers を上げても3分で頭打ち。ビルド（約40秒）と1本のサーバが
# ボトルネックなので、**ジョブごと分ける**（各シャードが自分のビルドとサーバを持つ）。
#
# 上のビルド（約40秒）は build ジョブで1回にした（下）。`npm ci` の重複（fast +
# build + 4シャード、計6回）は**あえて残した**。`actions/cache` で
# `node_modules` を package-lock のハッシュで鍵を切ればインストールそのものを
# 飛ばせるが、`npm ci` は「lock と node_modules を完全に一致させる」ための
# 道具で、キャッシュで飛ばすとその保証が薄れる（postinstall の再実行漏れ・
# 鍵の当たり損ないでの黙った不一致など）。`cache: npm` の効果もあって
# 1回あたり約25秒とビルドの約40秒より軽く、ビルドの1回化だけで狙いの短縮は
# 取れたので、ここには手を入れない。
jobs:
  # 速い門を先に、単独で。lint・型・単体・マスタは1分弱で答えが出る。
  # E2E の4分を待たずに「壊れている」と分かる方が、直すのが早い。
  fast:
    name: lint / types / unit / master
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # マスタ（master/*.json）の検証。スキーマと、実請求の再現。
      # **再現部は customs.json の rule を実際に評価する**ので、JSON を壊せばここで落ちる。
      - run: python3 master/validate.py
      # docs/MASTER.md の生成節が JSON とずれていないか。
      # 手書きの表は必ずずれるので、生成して CI で縛る。
      - run: python3 master/render-docs.py --check

  # 同じコミットを4シャードそれぞれが `npm run build` していた（約40秒 x4）。
  # ビルドの入力（ソース・依存関係）はどのシャードでも同じなので、ここで1回だけ
  # ビルドして `.next` を artifact に上げ、4シャードはそれを降ろして使う。
  #
  # **分離は壊さない。** artifact で渡すのはビルド成果物（`.next`）だけで、
  # サーバは今まで通り各シャードが `next start` で自分のを起こす
  # （playwright.config.ts の webServer、PW_SKIP_BUILD=1 でビルド行だけ飛ばす）。
  # 「シャード間は並列、シャード内・サーバは共有しない」という e2e ジョブの
  # コメントの判断はそのまま。
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: next-build
          path: .next
          retention-days: 1
          # 空だと4シャードが黙って「ビルド無し」で走ってしまう。上げ損ねたら
          # ここで落として気付けるようにする。
          if-no-files-found: error

  e2e:
    name: e2e ${{ matrix.shard }}/4
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      # **1つ落ちても残りを走らせる。** どこまで壊れているかが1回で分かる方が、
      # 落ちるたびに次の1件を見つけて回るより早い。
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # build ジョブが1回だけ作った `.next` を降ろす。artifact が無い・壊れている
      # ときは download-artifact がそのまま失敗するので、シャードは黙って
      # 「成功」にはならない（デフォルトで失敗時にジョブを落とす）。
      - uses: actions/download-artifact@v4
        with:
          name: next-build
          path: .next

      # ブラウザは毎回 25 秒かけて落としていた。版で鍵を切って使い回す。
      # **鍵は package-lock から取る。** 手で書くと上げ忘れて古いブラウザで
      # 検証し続けることになる。
      - name: Resolve Playwright version
        id: pw
        run: |
          v=$(node -p "require('./node_modules/@playwright/test/package.json').version")
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ steps.pw.outputs.version }}
      # キャッシュに当たっても OS の依存ライブラリは要る。当たらなければ本体も入れる。
      - run: npx playwright install --with-deps chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
      - run: npx playwright install-deps chromium
        if: steps.pw-cache.outputs.cache-hit == 'true'

      # 各シャードが自分のビルドとサーバを持つ（playwright.config.ts の webServer）。
      # **--shard は projects をまたいで件数で割る**ので、desktop と mobile が
      # 混ざったまま4等分される。
      # シャード内は直列のまま（`workers: 1` は playwright.config.ts が持つ）。
      # **シャード間の並列だけで速くする。** 1台の中で同時に走らせても速くはなるが
      # （実測 3.6分）、共有サーバの状態を触るテストが互いに干渉しうる。
      # いまは干渉しないと確かめたが、**速さのために依存を増やさない。**
      - run: npx playwright test --shard=${{ matrix.shard }}/4
        env:
          # ここで既にビルド済みの `.next` を降ろしてあるので、webServer 側の
          # ビルド行を飛ばす（playwright.config.ts）。ローカルの `npm run test:e2e`
          # はこの変数を立てないので今まで通り自前でビルドする。
          PW_SKIP_BUILD: '1'

      # 落ちた理由をログから掘らせない。トレースは Playwright で開ける。
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-trace-${{ matrix.shard }}
          path: |
            test-results/
            playwright-report/
          retention-days: 7
          if-no-files-found: ignore

  # **分けたぶん、緑の意味が薄れないようにする。**
  # ブランチ保護から見る対象をこの1つにできるよう、全ジョブの成否を集約する。
  # skipped や cancelled を成功と数えない（`needs.*.result == 'success'` で明示）。
  all-green:
    name: all green
    runs-on: ubuntu-latest
    needs: [fast, build, e2e]
    if: always()
    steps:
      - name: Fail unless every job succeeded
        run: |
          fast='${{ needs.fast.result }}'
          build='${{ needs.build.result }}'
          e2e='${{ needs.e2e.result }}'
          echo "fast=$fast build=$build e2e=$e2e"
          [ "$fast" = success ] && [ "$build" = success ] && [ "$e2e" = success ] || {
            echo "::error::CI is not green (fast=$fast, build=$build, e2e=$e2e)"
            exit 1
          }
