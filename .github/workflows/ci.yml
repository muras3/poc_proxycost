name: ci

# **pull_request だけで焚く。** push でも焚くと、PR にプッシュするたび
# 同じコミットを2回検証することになる（E2E だけで1回4分）。
# concurrency group を分けても event が違えば別 group になるので効かない。
# main への push は deploy.yml が受け持つ。
on:
  pull_request:

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # マスタ（master/*.json）の検証。スキーマと、実請求の再現。
      # **再現部は customs.json の rule を実際に評価する**ので、JSON を壊せばここで落ちる。
      - run: python3 master/validate.py
      # docs/MASTER.md の生成節が JSON とずれていないか。
      # 手書きの表は必ずずれるので、生成して CI で縛る。
      - run: python3 master/render-docs.py --check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
