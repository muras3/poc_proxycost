name: ci

# **pull_request だけで焚く。** push でも焚くと、PR にプッシュするたび
# 同じコミットを2回検証することになる（E2E だけで1回4分）。
# concurrency group を分けても event が違えば別 group になるので効かない。
# main への push は deploy.yml が受け持つ。
on:
  pull_request:

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
