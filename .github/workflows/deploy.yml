# Cloudflare Workers へのデプロイ。
# cloudflare-api の MCP は OAuth 認可が必要で、非対話セッションからは認可できないため、
# デプロイは GitHub Actions 経由で行う。トークンは会話には出さず GitHub Secrets に置く。
#
# 必要な Secrets（本人が設定する。TODO-USER.md を見ろ）:
#   CLOUDFLARE_API_TOKEN  … Workers Scripts:Edit / Workers KV Storage:Edit / Account Settings:Read
#   CLOUDFLARE_ACCOUNT_ID … ダッシュボード右下のアカウントID
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npx opennextjs-cloudflare build
      - name: Deploy
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
