# Cloudflare Workers へのデプロイ。
# cloudflare-api の MCP は OAuth 認可が必要で、非対話セッションからは認可できないため、
# デプロイは GitHub Actions 経由で行う。トークンは会話には出さず GitHub Secrets に置く。
#
# 必要な Secrets（本人が設定する。TODO-USER.md を見ろ）:
#   CLOUDFLARE_API_TOKEN  … Workers Scripts:Edit / Workers KV Storage:Edit / Account Settings:Read
#   CLOUDFLARE_ACCOUNT_ID … ダッシュボード右下のアカウントID
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # **secrets はステップの if では参照できない**（式の検証で弾かれ、
      # ワークフロー全体が invalid になる）。job の env なら参照できるので、
      # ここで真偽値に落としてから if で見る。
      HAS_CLOUDFLARE: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npx opennextjs-cloudflare build
      # Secrets が未設定なだけで main が赤く見えると、ビルドが壊れているのと
      # 区別がつかない。未設定のときは落とさず、何が足りないかを出して飛ばす。
      - name: Deploy
        if: env.HAS_CLOUDFLARE == 'true'
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy skipped — secrets not set
        if: env.HAS_CLOUDFLARE != 'true'
        run: |
          {
            echo "### デプロイを飛ばした"
            echo
            echo "ビルドとテストは通っている。以下が未設定なのでデプロイだけ行っていない。"
            echo
            echo '- `CLOUDFLARE_API_TOKEN`（Workers Scripts:Edit / Workers KV Storage:Edit / Account Settings:Read）'
            echo '- `CLOUDFLARE_ACCOUNT_ID`'
            echo
            echo "Settings → Secrets and variables → Actions で登録する。"
            echo 'あわせて `npx wrangler kv namespace create CACHE` で KV を作り、'
            echo 'wrangler.jsonc の `PLACEHOLDER_REPLACE_ME` と差し替えること。'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::warning::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID が未設定のためデプロイを飛ばした"
