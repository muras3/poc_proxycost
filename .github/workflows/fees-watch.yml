# 各社の公式料金ページに差分が出たら issue を立てる。数字は手で直す。自動更新はしない。
name: fees-watch

on:
  schedule:
    - cron: '17 2 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # data/fee-pages.json（前回の記録）は **この Action では更新しない。**
      # 比べる相手は常に git に入っている記録で、issue を読んだ人が原文を確かめて
      # 手で更新する。自動で書き戻すと「読んだことにする」だけになる。
      - id: diff
        run: npm run fees:check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
