    const subTxt = k==='door' ? '' : k==='packed' && !ls.length ? '' : `${yen(sub)}${open?'+':''}`;
    return `<li class="stage ${k}"><div class="rail" aria-hidden="true"><span class="node"></span><span class="lk"></span></div><div class="sbody">
      <h3 class="sname"><span><small>${String(si+1).padStart(2,'0')}</small>${esc(name)}</span><span class="num">${subTxt}</span></h3>
      ${k==='bought'&&cmp?`<div class="lhead lbl" aria-hidden="true"><span></span><span></span><span class="r">${esc(r.serviceName)}</span><span class="r">vs ${esc(cmp.serviceName)}</span></div>`:''}
      ${body || (k==='door'?'':'<p class="lnote">Nothing charged here.</p>')}</div></li>`;
  }).join('');
  return `<div class="log" id="log-${r.id}"><div class="login">
    <div class="loghead"><span style="display:flex;flex-direction:column;gap:2px"><span class="lbl">Delivery log \u00B7 ${esc(r.label)} \u00B7 ${boxWord(r.boxes.length)}</span><span class="tag">${esc(r.tag.split(' \u00B7 ').filter(t=>t!=='you must request this').join(' \u00B7 '))}</span><span class="ref ${r.paysUs?'pays':''}">${esc(r.referralNote ?? 'pays us nothing')} \u00B7 never moves a row</span></span>
    <span class="legend"><span><i></i>published</span><span class="e"><i></i>estimate</span><span class="u"><i></i>second-hand</span><span class="n" style="color:var(--red)"><i></i>not published</span></span></div>
    <ol class="stages">${stages}</ol></div></div>`;
}

function costTableHTML(res){
  const rows = res.rows;
  const keys = []; rows.forEach(r=>r.lines.forEach(l=>{ if(!keys.includes(l.key)) keys.push(l.key); }));
  const labelOf = k => { const ls = rows.flatMap(r=>r.lines).filter(l=>l.key===k); return (ls.find(l=>l.amount!=null)??ls[0])?.label ?? k; };
  const body = STAGES.filter(([k])=>k!=='door').map(([sk,sn])=>{
    const ks = keys.filter(k=>stageOf(k)===sk); if(!ks.length) return '';
    return `<tr><td class="stagecell" colspan="${rows.length+1}">${esc(sn)}</td></tr>` + ks.map(k=>`<tr><th scope="row" style="font-weight:400;text-align:left">${esc(labelOf(k))}</th>${rows.map(r=>{
      const l = r.lines.find(x=>x.key===k); if(!l) return '<td>\u2014</td>';
      const a = lineAmount(l);
      return `<td class="${a.cls}">${l.tier==='unverified'?`<span style="text-decoration:underline dotted 1px;text-underline-offset:3px">${esc(a.txt)}</span>`:esc(a.txt)}</td>`;
    }).join('')}</tr>`).join('');
  }).join('');
  return `<details class="fold" id="all-fees"><summary><h2>All fees, side by side</h2><span class="lbl">${keys.length} fees \u00D7 ${rows.length} rows</span></summary>
    <div class="tscroll" tabindex="0" role="region" aria-label="All fees table, scrolls sideways"><table class="ct"><thead><tr><th scope="col">Fee</th>${rows.map(r=>`<th scope="col" class="${SVC[r.serviceId]?.primarySource===false?'sec':''}">${esc(r.serviceName)}${r.variant?`<br><span class="lbl">${esc(r.variant)}</span>`:''}</th>`).join('')}</tr></thead>
    <tbody>${body}</tbody><tfoot><tr><td>Total</td>${rows.map(r=>`<td>${totalHTML(r,'tot')}</td>`).join('')}</tr></tfoot></table></div>
    <p class="lbl" style="margin:8px 0 0">Column underline: solid = fee table from the company's own page \u00B7 dashed = second-hand. Blue = our estimate \u00B7 red = not published.</p></details>`;
}
function wcboHTML(res){
  const rows = res.rows.filter(r=>r.comparable); const all = rows.flatMap(r=>r.lines);
  const uniq = f => [...new Set(all.filter(f).map(l=>l.label))];
  const e = uniq(l=>l.tier==='estimate'), s = uniq(l=>l.tier==='unverified'), m = uniq(l=>l.amount==null);
  const ca = rows.some(r=>r.closedByAssumption.length);
  return `<details class="fold" id="what-could-be-off"><summary><h2>What could be off</h2><span class="lbl">${e.length+s.length+m.length} fees</span></summary>
    <ul class="wcbo">
      ${e.length?`<li><span class="k e">Estimated</span><span>${esc(e.join(', '))}. Our assumptions, not published figures.</span></li>`:''}
      ${s.length?`<li><span class="k">Second-hand</span><span>${esc(s.join(', '))}. We have not read the original source.</span></li>`:''}
      ${m.length?`<li><span class="k n">Not included</span><span>${esc(m.join(', '))}. Your real bill will be higher, not lower.</span></li>`:''}
      ${ca?`<li><span class="k e">Courier rates</span><span>Rows priced by courier assume the listed rate already includes fuel surcharge; that's why 1st place can read \u201Cestimated cheapest\u201D.</span></li>`:''}
      <li><span class="k">Order</span><span>The order is what we stand behind. Whichever method wins is priced from its published rate table, but the weight \u2014 and, for a courier, the box size \u2014 that decides it is ours. Shipping is most of a total.</span></li>
    </ul></details>`;
}
function renderAd(show){
  // ad-placement.md \u00A73: after results, before footer; one slot; hidden with no results; label above; not paper.
  $('#ad').innerHTML = show ? `<aside class="adzone" aria-label="Advertisement"><span class="adlabel">Advertisement</span>
    <div class="adslot">${$('#app').clientWidth<=760?'320 \u00D7 100':'728 \u00D7 90'} \u00B7 reserved \u00B7 renders only after ad consent</div>
    <span class="adnote">Ads are served by Google and do not affect the ranking.</span></aside>` : '';
}
function renderFoot(res){
  $('#foot').innerHTML = `<div><p>Rows are ordered by total only. Buyee, ZenMarket and FROM JAPAN pay us for referrals; Neokyo and Jauce don't. Payment never moves a row.</p>
    <p>Rates read ${esc(res.currency.fetchedOn)} \u00B7 currency: ECB reference rate for ${esc(res.currency.asOf)} \u00B7 all totals in yen.</p></div>
    <nav aria-label="Footer"><a href="#weights">Weights</a><a href="#sources">Sources</a><a href="#privacy">Privacy</a><a href="#code">Source code</a></nav>`;
}

/* ================= row toggle + FLIP ================= */
document.getElementById('results').addEventListener('click', e=>{
  const t = e.target.closest('[data-toggle]'); if(!t || e.target.closest('.mk')) return;
  const id = t.dataset.toggle; S.open = S.open===id ? null : id; packSig = null;
  renderAll(); document.querySelector(`[data-toggle="${CSS.escape(id)}"]`)?.focus();
});
document.getElementById('results').addEventListener('change', e=>{
  if (!e.target.matches('[data-prov]')) return;
  S.province = e.target.value || null; renderAll(); document.querySelector('[data-prov]')?.focus();
});
function renderAll(){
  const before = new Map([...document.querySelectorAll('li[data-row-id]')].map(li=>[li.dataset.rowId, li.getBoundingClientRect().top]));
  const res = resultFor();
  renderWaybill(res); renderCart(res); renderResults(res); renderHeft(res);
  const openRow = S.open && res.rows.find(r=>r.id===S.open);
  const sig = openRow ? openRow.id+'|'+openRow.boxes.map(b=>b.weightG+':'+b.itemIndices.join(',')).join('/') : null;
  if (sig && sig !== packSig) animatePack(document.getElementById('log-'+openRow.id));
  packSig = sig;
  if (!RM.matches){
    document.querySelectorAll('li[data-row-id]').forEach(li=>{
      const from = before.get(li.dataset.rowId); const to = li.getBoundingClientRect().top;
      if (from==null || Math.abs(from-to)<1 || li.classList.contains('tiedmove')) return;
      li.animate([{transform:`translateY(${from-to}px)`},{transform:'none'}],{duration:260,easing:'cubic-bezier(.2,.7,.3,1)'});
    });
  }
}

  empty:'0 items', adding:'keyword \u2192 example candidates', manual:'manual add form open',
  editing:'1st row open; decisive weight item highlighted',
  method:'CA \u00B7 courier-dhl: engine marks 5 rows comparable:false',

  norate:'engine: GB \u00B7 40 kg \u2192 no comparable row',
  loading:'URL fetch in progress (held)', error:'fetch failed notice (4 variants: unreadable/listpage/nosearch/searchdown)',
};
function one(w, title='\u30C6\u30B9\u30C8\u5546\u54C1 \u30D5\u30A3\u30AE\u30E5\u30A2', site='amazon-jp'){ return mkItem({title, price:3000, site, w, origin:'user', priceTier:'fixed'}); }
function setState(k){
  closePop(false); if(S.dialog) closeDialog();
  seq = 0; prevText.clear();
  Object.assign(S,{items:EXAMPLE(),unpriced:new Set(),country:'CA',province:null,method:'cheapest',storageDays:45,open:null,busy:false,notice:null,pending:null,readOn:{},cartOpen:false,placeOpen:false,placeFocus:null}); packSig = null; heftN = null; heftSig = null;
  S.readOn['i4'] = '2026-09-12'; S.items[4].url = 'https://www.suruga-ya.jp/product/detail/000000000';
  toggleManual(false); $('#q').value='';
  if (k==='empty') S.items = [];
  if (k==='editing'){ const r = resultFor(); S.open = r.rows.find(x=>x.comparable)?.id ?? null; S.cartOpen = true; }
  if (k==='method') S.method = 'courier-dhl';
  if (k==='tied'){ S.items = [one(200,'\u306D\u3093\u3069\u308D\u3044\u3069 \u93E1\u97F3\u30EA\u30F3')]; S.method='ems'; }
  if (k==='indet'){ S.country='US'; S.method='courier-buyee-air'; S.items=[one(600,'\u306D\u3093\u3069\u308D\u3044\u3069 \u93E1\u97F3\u30EA\u30F3'),one(600,'figma \u521D\u97F3\u30DF\u30AF'),one(600,'\u4E00\u756A\u304F\u3058 \u30E9\u30D0\u30FC\u30B9\u30C8\u30E9\u30C3\u30D7')]; }
  if (k==='norate'){ S.country='GB'; S.items=[one(40000,'\u30A2\u30FC\u30B1\u30FC\u30C9\u7B50\u4F53 \u30D1\u30FC\u30C4 \u4E00\u5F0F')]; }
  renderAddBusy(); renderNotice(); renderAll();
  if (k==='adding'){ $('#q').value='\u306D\u3093\u3069\u308D\u3044\u3069'; openCandidates('\u306D\u3093\u3069\u308D\u3044\u3069'); }
  if (k==='manual') toggleManual(true);
  if (k==='loading'){ $('#q').value='https://page.auctions.yahoo.co.jp/jp/auction/x000000000'; startFetch($('#q').value, true); }
  if (k==='error'){ $('#q').value='https://jp.mercari.com/search?keyword=fail'; setNotice('unreadable'); }
  if (k==='editing'){ const hot = document.querySelector('.item.hot'); hot && hot.scrollIntoView({block:'center'}); }
  $('#mockWhy').textContent = WHY[k] ?? '';
}
/* Makeup toggle: attribute only. No re-render, so open rows, selection and
   running animations survive the switch. */
document.querySelectorAll('#makeup .mkup').forEach(b=>b.addEventListener('click', ()=>{
  const mk = b.dataset.makeup;
  document.documentElement.setAttribute('data-makeup', mk);
  document.querySelectorAll('#makeup .mkup').forEach(o=>o.setAttribute('aria-pressed', String(o.dataset.makeup===mk)));

$('#mockState').addEventListener('change', e=>setState(e.target.value));
$('#phoneBtn').addEventListener('click', e=>{ const on = e.currentTarget.getAttribute('aria-pressed')!=='true'; e.currentTarget.setAttribute('aria-pressed', String(on)); $('#app').classList.toggle('phone', on); renderAll(); });
const initialState = new URLSearchParams(location.search).get('state') || 'initial';
$('#mockState').value = initialState; setState(initialState);
})();
